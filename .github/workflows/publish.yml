name: Publish
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crates-io-publish
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Require crates.io authentication
        shell: bash
        run: test -n "$CARGO_REGISTRY_TOKEN" || { echo "Configure the CARGO_REGISTRY_TOKEN repository secret before publishing."; exit 1; }
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Publish procedural macros first
        run: cargo publish --locked --package tauri3-specta-macros
      - name: Publish library
        run: cargo publish --locked --package tauri3-specta
