name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --lib --locked
      - name: Generate bindings
        shell: bash
        run: |
          mkdir -p tests/generated
          cargo run --locked --example export -- tests/generated/bindings.ts
      - run: bun run typecheck
      - run: bun test
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
