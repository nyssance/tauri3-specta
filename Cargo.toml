[workspace]
members = ["macros"]
resolver = "3"

[package]
name = "tauri3-specta"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Type-safe TypeScript commands and events for Tauri 3, powered by Specta"
license = "MIT"
repository = "https://github.com/nyssance/tauri3-specta"
readme = "README.md"
keywords = ["tauri", "specta", "typescript", "bindings", "codegen"]
categories = ["development-tools::ffi"]

[dependencies]
tauri = { version = "=3.0.0-alpha.3", default-features = false, features = ["specta"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function", "serde_json"] }
specta-typescript = "=0.0.12"
specta-serde = "=0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
heck = "0.5.0"
thiserror = "2.0.21"
tauri3-specta-macros = { version = "=0.1.0-alpha.1", path = "macros" }

[dev-dependencies]
tauri = { version = "=3.0.0-alpha.3", default-features = false, features = ["test", "specta"] }

# alpha.3's mock runtime gates WindowBuilder::transparent on this feature,
# while tauri-runtime requires that method unconditionally. Test-only fix.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tauri = { version = "=3.0.0-alpha.3", default-features = false, features = ["macos-private-api"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
